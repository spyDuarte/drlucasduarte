                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setTimeout(() => setIsVisible(true), delay);
                            observer.disconnect();
                        }
                    },
                    { threshold: 0.1, rootMargin: '50px' }
                );
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, [delay]);

            return (
                <div 
                    ref={ref} 
                    className={`transition-all duration-700 transform ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'} ${className}`}

                                                        <Icons.Star key={i} className="h-4 w-4 text-brand-500" />
                                                    ))}
                                                </div>
                                            </div>
                                        </RevealOnScroll>
                                    ))}
                                </div>
                            </div>

                        {/* Glossary */}
                        <section id="glossario" className="py-24 bg-slate-50 border-b border-slate-200" aria-labelledby="glossario-title">

                                    {[
                                        { term: "Nexo Causal", def: "Vínculo direto entre o trabalho/acidente e a lesão ou doença. É o elemento que liga a causa ao efeito danoso." },
                                        { term: "Concausa", def: "Fator preexistente, concomitante ou superveniente que, somado à causa principal, contribui para agravar o dano." },
                                        { term: "Baremo", def: "Tabela utilizada para quantificar percentualmente o grau de invalidez ou incapacidade (ex: DPVAT, SUSEP, AMA)." },
                                        { term: "Simulação", def: "Produção intencional de sintomas falsos ou exagerados com objetivo de obter benefício ilícito." },
                                        { term: "Dano Estético", def: "Alteração morfológica permanente que causa constrangimento, humilhação ou desvantagem social ao indivíduo." },
                                        { term: "Incapacidade Laborativa", def: "Redução total ou parcial da capacidade de exercer atividade profissional, podendo ser temporária ou permanente." }
