<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Perito - Medicina Legal</title>

    <!-- 1. Carregar Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. Carregar React e ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 3. Carregar Babel para traduzir o JSX no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 4. Carregar Lucide Icons (Versão Script) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Configuração do Tailwind para fontes e cores -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Estilos de Animação -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Merriweather:wght@300;400;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-scale-up { animation: scaleUp 0.3s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.5s ease-out forwards; }
        .animate-slide-in { animation: slideIn 0.4s ease-out forwards; }
        
        /* Ajuste para Scrollbar no Iframe */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #d97706; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Container Raiz do React -->
    <div id="root"></div>

    <!-- Lógica do React -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Mapeamento de Ícones (Bridge Lucide -> React) ---
        // Isso cria componentes React a partir dos ícones SVG globais
        const IconWrapper = ({ name, ...props }) => {
            const iconData = lucide.icons[name];
            if (!iconData) return null;
            
            // Converter estrutura do Lucide para SVG React
            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width="24" 
                    height="24" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    {...props}
                >
                    {iconData.map((child, index) => {
                        const Tag = child[0];
                        return <Tag key={index} {...child[1]} />;
                    })}
                </svg>
            );
        };

        // Definindo os componentes de ícones usados no código original
        const Scale = (props) => <IconWrapper name="Scale" {...props} />;
        const BookOpen = (props) => <IconWrapper name="BookOpen" {...props} />;
        const FileText = (props) => <IconWrapper name="FileText" {...props} />;
        const Briefcase = (props) => <IconWrapper name="Briefcase" {...props} />;
        const ChevronRight = (props) => <IconWrapper name="ChevronRight" {...props} />;
        const Mail = (props) => <IconWrapper name="Mail" {...props} />;
        const Phone = (props) => <IconWrapper name="Phone" {...props} />;
        const MapPin = (props) => <IconWrapper name="MapPin" {...props} />;
        const Gavel = (props) => <IconWrapper name="Gavel" {...props} />;
        const Search = (props) => <IconWrapper name="Search" {...props} />;
        const CheckCircle = (props) => <IconWrapper name="CheckCircle" {...props} />;
        const Clock = (props) => <IconWrapper name="Clock" {...props} />;
        const Menu = (props) => <IconWrapper name="Menu" {...props} />;
        const X = (props) => <IconWrapper name="X" {...props} />;
        const Award = (props) => <IconWrapper name="Award" {...props} />;
        const TrendingUp = (props) => <IconWrapper name="TrendingUp" {...props} />;
        const ShieldCheck = (props) => <IconWrapper name="ShieldCheck" {...props} />;
        const MessageCircle = (props) => <IconWrapper name="MessageCircle" {...props} />;
        const Send = (props) => <IconWrapper name="Send" {...props} />;
        const User = (props) => <IconWrapper name="User" {...props} />;
        const CalendarDays = (props) => <IconWrapper name="CalendarDays" {...props} />;
        const ArrowUp = (props) => <IconWrapper name="ArrowUp" {...props} />;
        const Cookie = (props) => <IconWrapper name="Cookie" {...props} />;
        const Quote = (props) => <IconWrapper name="Quote" {...props} />;
        const Book = (props) => <IconWrapper name="Book" {...props} />;
        const Check = (props) => <IconWrapper name="Check" {...props} />;
        const AlertCircle = (props) => <IconWrapper name="AlertCircle" {...props} />;
        const ExternalLink = (props) => <IconWrapper name="ExternalLink" {...props} />;

        // --- COMPONENTE DE ANIMAÇÃO AO SCROLL (REVEAL) ---
        const RevealOnScroll = ({ children, className = "" }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                ([entry]) => {
                    if (entry.isIntersecting) {
                    setIsVisible(true);
                    observer.disconnect();
                    }
                },
                { threshold: 0.1 }
                );
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);

            return (
                <div 
                ref={ref} 
                className={`transition-all duration-1000 transform ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'} ${className}`}
                >
                {children}
                </div>
            );
        };

        // --- COMPONENTE DE NOTIFICAÇÃO (TOAST) ---
        const Toast = ({ message, type = 'success', onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 4000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className={`fixed top-24 right-6 z-[80] flex items-center p-4 rounded-lg shadow-2xl animate-slide-in border-l-4 ${type === 'success' ? 'bg-white border-green-500 text-slate-800' : 'bg-white border-red-500 text-slate-800'}`}>
                <div className={`p-2 rounded-full mr-3 ${type === 'success' ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}`}>
                    {type === 'success' ? <Check className="h-5 w-5" /> : <AlertCircle className="h-5 w-5" />}
                </div>
                <div>
                    <h4 className="font-bold text-sm">{type === 'success' ? 'Sucesso!' : 'Erro'}</h4>
                    <p className="text-xs text-slate-500">{message}</p>
                </div>
                <button onClick={onClose} className="ml-4 text-slate-400 hover:text-slate-600">
                    <X className="h-4 w-4" />
                </button>
                </div>
            );
        };

        // --- COMPONENTE PRINCIPAL (APP) ---
        const PericiaSite = () => {
            const [activeTab, setActiveTab] = useState('assistencia');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [openFaq, setOpenFaq] = useState(null);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [modalTab, setModalTab] = useState('message'); 
            const [scrolled, setScrolled] = useState(false);
            const [showCookieBanner, setShowCookieBanner] = useState(false);
            const [scrollProgress, setScrollProgress] = useState(0);
            
            // States para Formulário e Feedback
            const [formLoading, setFormLoading] = useState(false);
            const [toast, setToast] = useState(null); // { message, type }
            const [phoneInput, setPhoneInput] = useState("");

            // Efeito de scroll
            useEffect(() => {
                const handleScroll = () => {
                setScrolled(window.scrollY > 20);
                const totalScroll = document.documentElement.scrollTop;
                const windowHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scroll = `${totalScroll / windowHeight}`;
                setScrollProgress(Number(scroll));
                };

                window.addEventListener('scroll', handleScroll);
                
                const timer = setTimeout(() => {
                const consent = localStorage.getItem('cookieConsent');
                if (!consent) setShowCookieBanner(true);
                }, 2000);

                return () => {
                window.removeEventListener('scroll', handleScroll);
                clearTimeout(timer);
                };
            }, []);

            // Máscara de Telefone
            const handlePhoneChange = (e) => {
                let value = e.target.value.replace(/\D/g, "");
                if (value.length > 11) value = value.slice(0, 11);
                
                if (value.length > 2) {
                value = `(${value.slice(0, 2)}) ${value.slice(2)}`;
                }
                if (value.length > 7) {
                value = `${value.slice(0, 5)}-${value.slice(5)}`;
                }
                setPhoneInput(value);
            };

            // Simulação de Envio de Formulário
            const handleSubmit = (e) => {
                e.preventDefault();
                setFormLoading(true);
                
                // Simula delay de rede
                setTimeout(() => {
                setFormLoading(false);
                setIsModalOpen(false);
                setToast({ message: "Sua solicitação foi enviada. Entraremos em contato em breve.", type: "success" });
                setPhoneInput("");
                }, 1500);
            };

            const acceptCookies = () => {
                localStorage.setItem('cookieConsent', 'true');
                setShowCookieBanner(false);
            };

            const toggleFaq = (index) => {
                setOpenFaq(openFaq === index ? null : index);
            };

            const openContactModal = (e, tab = 'message') => {
                if(e) e.preventDefault();
                setModalTab(tab);
                setIsModalOpen(true);
                setIsMobileMenuOpen(false);
            };

            const scrollToTop = () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800 relative">
                
                {/* Toast Notification */}
                {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

                {/* ACCESSIBILITY: Skip Link */}
                <a href="#main-content" className="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:bg-amber-600 focus:text-white focus:px-4 focus:py-2 focus:rounded-md">
                    Pular para o conteúdo principal
                </a>

                {/* UX: Reading Progress Bar */}
                <div className="fixed top-0 left-0 h-1 bg-amber-600 z-[60]" style={{ width: `${scrollProgress * 100}%` }}></div>

                {/* UX: Back to Top Button */}
                <button
                    onClick={scrollToTop}
                    className={`fixed bottom-24 right-6 z-40 bg-slate-800 text-white p-3 rounded-full shadow-lg transition-all duration-300 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500 ${scrolled ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10 pointer-events-none'}`}
                    aria-label="Voltar ao topo"
                >
                    <ArrowUp className="h-5 w-5" />
                </button>

                {/* LEGAL: Cookie Banner */}
                {showCookieBanner && (
                    <div className="fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 p-4 z-[60] shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] animate-slide-up">
                    <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                        <div className="flex items-center gap-4">
                        <div className="bg-amber-100 p-2 rounded-full hidden sm:block">
                            <Cookie className="h-6 w-6 text-amber-600" />
                        </div>
                        <p className="text-sm text-slate-600">
                            Conforme a <strong>LGPD</strong>, utilizamos cookies para melhorar a experiência. 
                            <a href="#" className="text-amber-600 ml-1 underline hover:text-amber-700">Política de Privacidade</a>.
                        </p>
                        </div>
                        <div className="flex gap-3 w-full md:w-auto">
                        <button onClick={() => setShowCookieBanner(false)} className="px-4 py-2 text-sm text-slate-500 hover:text-slate-700 font-medium w-full md:w-auto rounded">
                            Recusar
                        </button>
                        <button onClick={acceptCookies} className="px-6 py-2 text-sm bg-slate-900 text-white rounded hover:bg-slate-800 font-medium w-full md:w-auto shadow-md">
                            Aceitar
                        </button>
                        </div>
                    </div>
                    </div>
                )}

                {/* Floating WhatsApp */}
                <a 
                    href="https://wa.me/5511999999999" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    className="fixed bottom-6 right-6 z-50 bg-green-500 hover:bg-green-600 text-white p-4 rounded-full shadow-2xl transition-transform hover:scale-110 flex items-center justify-center group focus:outline-none focus:ring-4 focus:ring-green-300"
                    aria-label="Falar no WhatsApp"
                >
                    <MessageCircle className="h-8 w-8" />
                    <span className="absolute right-full mr-3 bg-white text-slate-800 px-3 py-1 rounded shadow-md text-sm font-bold whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                    Orçamento Rápido
                    </span>
                </a>

                {/* Contact Modal */}
                {isModalOpen && (
                    <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm animate-fade-in" onClick={() => setIsModalOpen(false)}>
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden relative animate-scale-up" onClick={e => e.stopPropagation()}>
                        <button 
                        onClick={() => setIsModalOpen(false)}
                        className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 bg-slate-100 rounded-full p-1 transition-colors z-10"
                        >
                        <X className="h-6 w-6" />
                        </button>
                        
                        <div className="bg-slate-900 p-6 text-white">
                        <div className="flex space-x-6 mb-4">
                            <button 
                            onClick={() => setModalTab('message')}
                            className={`pb-2 text-sm font-bold uppercase tracking-wider transition-colors border-b-2 ${modalTab === 'message' ? 'border-amber-500 text-white' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                            >
                            Mensagem
                            </button>
                            <button 
                            onClick={() => setModalTab('schedule')}
                            className={`pb-2 text-sm font-bold uppercase tracking-wider transition-colors border-b-2 ${modalTab === 'schedule' ? 'border-amber-500 text-white' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                            >
                            Agendar
                            </button>
                        </div>
                        
                        {modalTab === 'message' ? (
                            <div>
                            <h3 className="text-xl font-bold flex items-center">
                                <Mail className="mr-2 h-5 w-5 text-amber-500" />
                                Solicitar Proposta
                            </h3>
                            <p className="text-slate-400 text-sm mt-1">Resposta garantida em até 12 horas úteis.</p>
                            </div>
                        ) : (
                            <div>
                            <h3 className="text-xl font-bold flex items-center">
                                <CalendarDays className="mr-2 h-5 w-5 text-amber-500" />
                                Reunião Online
                            </h3>
                            <p className="text-slate-400 text-sm mt-1">Verifique a disponibilidade em tempo real.</p>
                            </div>
                        )}
                        </div>
                        
                        <div className="p-6">
                        {modalTab === 'message' ? (
                            <form className="space-y-4" onSubmit={handleSubmit}>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">Nome / Escritório</label>
                                <div className="relative">
                                <User className="absolute left-3 top-3 h-5 w-5 text-slate-400" />
                                <input required type="text" className="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none transition-all" placeholder="Dr. Nome Sobrenome" />
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">Telefone</label>
                                <input 
                                    required 
                                    type="tel" 
                                    value={phoneInput}
                                    onChange={handlePhoneChange}
                                    className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none" 
                                    placeholder="(11) 99999-9999" 
                                />
                                </div>
                                <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">Demanda</label>
                                <select className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none bg-white">
                                    <option>Assistência Técnica</option>
                                    <option>Perícia Trabalhista</option>
                                    <option>Perícia Cível</option>
                                    <option>Outros</option>
                                </select>
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">Resumo</label>
                                <textarea rows="3" className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Breve descrição..."></textarea>
                            </div>
                            <button 
                                type="submit" 
                                disabled={formLoading}
                                className={`w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-lg shadow-lg hover:shadow-amber-900/20 transition-all flex items-center justify-center ${formLoading ? 'opacity-75 cursor-not-allowed' : ''}`}
                            >
                                {formLoading ? (
                                <span className="flex items-center">
                                    Enviando...
                                </span>
                                ) : (
                                <>
                                    <Send className="mr-2 h-5 w-5" />
                                    Enviar Solicitação
                                </>
                                )}
                            </button>
                            </form>
                        ) : (
                            <div className="space-y-4 animate-fade-in">
                            <div className="grid grid-cols-3 gap-2 mb-4">
                                {['Seg', 'Ter', 'Qua'].map(day => (
                                    <div key={day} className="text-center font-bold text-slate-500 text-sm mb-2">{day}</div>
                                ))}
                                {['09:00', '11:00', '14:30', '10:00', '15:00', '16:30', '09:30', '13:00', '17:00'].map((time, i) => (
                                    <button 
                                        key={i} 
                                        onClick={() => {
                                        setIsModalOpen(false);
                                        setToast({ message: `Solicitação de agendamento para ${time} recebida. Confirmaremos via WhatsApp.`, type: 'success' });
                                        }}
                                        className="py-2 text-sm border border-slate-200 rounded hover:bg-amber-50 hover:border-amber-500 hover:text-amber-700 transition-colors focus:ring-2 focus:ring-amber-500 focus:outline-none"
                                    >
                                        {time}
                                    </button>
                                ))}
                            </div>
                            <p className="text-xs text-slate-500 text-center mb-4">Horários de Brasília (GMT-3)</p>
                            <button className="w-full border border-slate-300 text-slate-700 font-bold py-3 rounded-lg hover:bg-slate-50 transition-all">
                                Ver Próxima Semana
                            </button>
                            </div>
                        )}
                        </div>
                    </div>
                    </div>
                )}

                {/* Navigation */}
                <nav className={`fixed w-full top-0 z-40 transition-all duration-300 ${scrolled ? 'bg-slate-900/95 backdrop-blur-md shadow-xl py-2' : 'bg-slate-900 py-4'} text-white border-b border-slate-800`}>
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                        <div className="bg-amber-600 p-1.5 rounded-lg shadow-lg shadow-amber-900/50">
                            <Scale className="h-6 w-6 text-white" />
                        </div>
                        <div className="flex flex-col">
                            <span className="font-bold text-lg tracking-wide leading-none font-serif">DR. NOME SOBRENOME</span>
                            <span className="text-[10px] text-slate-400 tracking-widest uppercase mt-0.5">Medicina Legal e Perícias</span>
                        </div>
                        </div>

                        <div className="hidden md:block">
                        <div className="ml-10 flex items-center space-x-6">
                            <a href="#inicio" className="text-slate-300 hover:text-white text-sm font-medium transition-colors hover:border-b border-amber-500 pb-0.5">Início</a>
                            <a href="#atuacao" className="text-slate-300 hover:text-white text-sm font-medium transition-colors hover:border-b border-amber-500 pb-0.5">Atuação</a>
                            <a href="#diferencial" className="text-slate-300 hover:text-white text-sm font-medium transition-colors hover:border-b border-amber-500 pb-0.5">O Laudo</a>
                            <a href="#glossario" className="text-slate-300 hover:text-white text-sm font-medium transition-colors hover:border-b border-amber-500 pb-0.5">Glossário</a>
                            <button 
                            onClick={(e) => openContactModal(e, 'message')}
                            className="bg-amber-600 hover:bg-amber-700 text-white px-5 py-2 rounded-md text-sm font-bold shadow-lg shadow-amber-900/20 hover:shadow-amber-900/40 transition-all transform hover:-translate-y-0.5 flex items-center"
                            >
                            <CalendarDays className="w-4 h-4 mr-2" />
                            Agendar
                            </button>
                        </div>
                        </div>

                        <div className="md:hidden">
                        <button 
                            onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                            className="inline-flex items-center justify-center p-2 rounded-md text-slate-400 hover:text-white hover:bg-slate-800 focus:outline-none transition-colors"
                        >
                            {isMobileMenuOpen ? <X className="h-6 w-6" /> : <Menu className="h-6 w-6" />}
                        </button>
                        </div>
                    </div>
                    </div>

                    {isMobileMenuOpen && (
                    <div className="md:hidden bg-slate-800 border-t border-slate-700 shadow-2xl">
                        <div className="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                        <a href="#inicio" onClick={() => setIsMobileMenuOpen(false)} className="text-slate-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Início</a>
                        <a href="#atuacao" onClick={() => setIsMobileMenuOpen(false)} className="text-slate-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Atuação</a>
                        <a href="#diferencial" onClick={() => setIsMobileMenuOpen(false)} className="text-slate-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">O Laudo</a>
                        <a href="#glossario" onClick={() => setIsMobileMenuOpen(false)} className="text-slate-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Glossário Técnico</a>
                        <button onClick={(e) => openContactModal(e, 'schedule')} className="w-full bg-amber-600 text-white block px-3 py-3 rounded-md text-base font-bold mt-4 text-center shadow-lg">
                            Agendar Reunião
                        </button>
                        </div>
                    </div>
                    )}
                </nav>

                <main id="main-content">
                    
                    {/* Hero Section */}
                    <div id="inicio" className="bg-slate-900 text-white pt-32 pb-24 lg:pt-40 lg:pb-48 relative overflow-hidden">
                    <div className="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 bg-amber-600 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-pulse"></div>
                    <div className="absolute bottom-0 left-0 -ml-20 -mb-20 w-72 h-72 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-pulse animation-delay-2000"></div>
                    <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
